# -------------------------------------------------------------
# 1. JUNIT 5 CORE GLOBAL PARALLELISM CONFIGURATION
# -------------------------------------------------------------
# Activates the top-level JUnit 5 engine capability to process tests concurrently
junit.jupiter.execution.parallel.enabled=true

# Forces classes and individual scenarios to run simultaneously across worker pipelines
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# -------------------------------------------------------------
# 2. CUCUMBER ROUTING AND REPORTING CONFIGURATION
# -------------------------------------------------------------
# Tells the execution engine where to locate your Steps Definitions and Hooks classes
cucumber.glue=com.stepdefs, com.hooks

# Generates clean console readouts and builds a structured HTML report in your target folder
cucumber.plugin=pretty, html:target/cucumber-reports/report.html

# Mutes the default cloud reporting banner text inside your terminal logs
cucumber.publish.quiet=true

# -------------------------------------------------------------
# 3. THREAD CONTROL CONFIGURATION (CLAMPS RUN TO 2 BROWSERS)
# -------------------------------------------------------------
# Activates Cucumber's dedicated execution engine parallelizer
cucumber.execution.parallel.enabled=true

# Tells the ForkJoinPool engine to distribute tests based on a fixed numeric limit
cucumber.execution.parallel.config.strategy=fixed

# STRICTLY FORCES THE ENGINE TO LIMIT ACTIVE PROCESSING TO EXACTLY 2 THREADS AT A TIME.
# The remaining tests will wait in a queue until one of the first two browsers finishes.
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.parallel.config.fixed.max-pool-size=2
