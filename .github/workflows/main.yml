name: Cucumber Tests on CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '16'
        distribution: 'temurin'

    - name: Build and run Cucumber tests with Maven
      run: mvn clean test -Dtest=TestRunner -Dmaven.test.failure.ignore=true

    #Optional: Upload test results as artifacts
  	- name: Upload Test Reports
      if: always()
      uses: actions/actions-artifact@v3
      with:
        name: surefire-test-reports
        path: target/surefire-reports/
